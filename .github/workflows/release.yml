name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable module version to release (for example 0.1.0)
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.26.0"
          cache: true

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ -z "$version" ]]; then
            echo "missing_version" >&2
            exit 1
          fi

          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_version_must_be_stable_semver:$version" >&2
            exit 1
          fi

          package_version="$(grep -E 'Version\s*=\s*"' config.go | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if [[ "$package_version" != "$version" ]]; then
            echo "package_version_mismatch:$package_version:$version" >&2
            exit 1
          fi
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.value }}

      - name: Run quality gates
        run: |
          make verify
          make verify-race

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: v2.12.2

      - name: Validate publishable module
        run: make smoke-module

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release_version.outputs.value }}
          generate_release_notes: true