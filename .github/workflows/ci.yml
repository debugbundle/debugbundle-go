name: ci

on:
  push:
    branches: ["main"]
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "README.md"
      - "Makefile"
      - "smoke/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.21", "1.22", "1.23", "1.24", "1.25", "1.26", "1.27"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify
        run: make verify

  race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.27"
          cache: true

      - name: Race verification
        run: make verify-race

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version: "1.27"
          cache: true

      - name: Module listing
        run: make mod-check

      - name: golangci-lint
        # Keep the linter and its compiler/export-data reader together, matching
        # the verified local gate even when setup-go installs a newer compiler.
        run: make lint-docker

  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Clean-install smoke
        run: make smoke
